<!DOCTYPE html>
<html>
<head>
  <title>Lebanon Delivery App</title>

  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- Google Maps -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>
</head>

<body onload="initMap()">

<h1>🚀 Delivery App</h1>

<!-- LOGIN -->
<div id="login">
  <input id="username" placeholder="Your name">
  <button onclick="login()">Enter</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<button onclick="show('food')">Food</button>
<button onclick="show('driver')">Driver</button>

<div id="food" class="page">
  <div onclick="addItem('Burger',5)">Burger - $5</div>
</div>

<div id="driver" class="page">
  <div onclick="addItem('Pickup',5)">Pickup service</div>
</div>

<h2>Cart</h2>
<ul id="cart"></ul>
Total: $<span id="total">0</span>

<br><br>

<input id="clientName" placeholder="Name">
<input id="clientPhone" placeholder="Phone">
<input id="clientAddress" placeholder="Address">

<select id="payment">
  <option>Cash</option>
  <option>MyMonty</option>
  <option>OMT</option>
</select>

<button onclick="checkout()">Order</button>

<div id="tracking"></div>
<div id="map" style="height:300px;"></div>

</div>

<script src="firebase.js"></script>
<script src="app.js"></script>
<script src="map.js"></script>

</body>
</html>
